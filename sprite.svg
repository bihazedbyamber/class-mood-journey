<svg xmlns="http://www.w3.org/2000/svg">
  <!-- =================================================================
       Class Mood Journey — shared drawings
       Each <symbol> is one drawing. Pages use it like this:
         <svg><use data-face="5" href="sprite.svg#face-modern-2026-5"/></svg>
       settings.js points it at the face set of the current style:
       face-modern-2026-N, face-scribblish-N, face-modern-bold-N.
       Doodles with fill/stroke="currentColor" take the CSS `color`.
       ================================================================= -->

  <defs>
    <!-- Makes clean lines look slightly hand-drawn (Scribblish faces) -->
    <filter id="wobble" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- =================================================================
